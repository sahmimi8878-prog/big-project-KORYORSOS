<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B8FE0"/>
      <stop offset="100%" stop-color="#7C6FD6"/>
    </linearGradient>
    <radialGradient id="blobGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3A6C6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F3A6C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1EDFF"/>
    </linearGradient>
  </defs>

  <!-- พื้นหลังวงกลมไล่สีม่วง -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>

  <!-- ลูกบอลสีชมพูตกแต่ง (เอกลักษณ์เดียวกับหน้า Login) -->
  <circle cx="315" cy="85" r="70" fill="url(#blobGrad)"/>
  <circle cx="70" cy="330" r="55" fill="url(#blobGrad)"/>

  <!-- ไอคอนหมวกบัณฑิตแบบมินิมอล -->
  <g transform="translate(200,128)">
    <path d="M -55 -8 L 0 -32 L 55 -8 L 0 16 Z" fill="url(#capGrad)"/>
    <path d="M -30 4 L -30 26 C -30 40 30 40 30 26 L 30 4 L 0 18 Z" fill="url(#capGrad)" opacity="0.92"/>
    <line x1="55" y1="-8" x2="55" y2="22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="55" cy="26" r="4" fill="#F3A6C6"/>
  </g>

  <!-- โหลดฟอนต์ไทยแบบน่ารัก (Mali) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mali:wght@600;700&amp;display=swap');
    .thai-cute { font-family: 'Mali', 'Bai Jamjuree', 'Sarabun', sans-serif; }
  </style>

  <!-- ตัวอักษร กยศ แบบน่ารัก -->
  <text x="202" y="262" text-anchor="middle" class="thai-cute"
        font-size="80" font-weight="700" fill="#5B4FA8"
        stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"
        paint-order="stroke">กยศ</text>
  <text x="202" y="262" text-anchor="middle" class="thai-cute"
        font-size="80" font-weight="700" fill="#FFFFFF">กยศ</text>

  <!-- ดาวเล็กๆ ตกแต่งความน่ารัก -->
  <path d="M 268 200 l 4 9 l 10 1 l -7 7 l 2 10 l -9 -5 l -9 5 l 2 -10 l -7 -7 l 10 -1 Z" fill="#FFD966"/>
  <circle cx="128" cy="212" r="5" fill="#FFD966"/>

  <!-- เส้นคั่นเล็กๆ ใต้ตัวอักษร -->
  <rect x="150" y="280" width="100" height="4" rx="2" fill="#F3A6C6"/>

  <!-- ข้อความรอง -->
  <text x="200" y="308" text-anchor="middle"
        font-family="'Poppins','Sarabun',sans-serif"
        font-size="12.5" font-weight="600" fill="#EDE9FB"
        letter-spacing="0.6">Prince of Songkla University,</text>
  <text x="200" y="326" text-anchor="middle"
        font-family="'Poppins','Sarabun',sans-serif"
        font-size="12.5" font-weight="600" fill="#EDE9FB"
        letter-spacing="0.6">Hat Yai Campus</text>
</svg>
